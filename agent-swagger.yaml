openapi: 3.0.0
info:
  title: Agent Layer API - Система генерации структуры документов (Вариант 6)
  version: 1.0.0
  description: |
    API агентного уровня распределенной системы.
    Сервис принимает запросы на генерацию структуры от транспортного уровня,
    выполняет инференс на локальной LLM (Ollama, модель 1-7 млрд параметров),
    нарезает результат на сегменты по 512 байт и передает их в транспортный шлюз (/transfer).
servers:
  - url: http://localhost:8000
    description: Локальный сервер агентного уровня (FastAPI)

paths:
  /api/v1/generate:
    post:
      summary: Запуск генерации структуры документа
      description: |
        Принимает тему документа и timestamp от транспортного уровня. 
        Запускает фоновый процесс инференса локальной LLM и возвращает статус 202 Accepted.
      operationId: generateStructure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppMessage'
            example:
              sender: Ivan_Student
              timestamp: 1715600000
              document_topic: Архитектура распределенных высоконагруженных систем
      responses:
        '202':
          description: Задача успешно поставлена в очередь генерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
              example:
                success: true
                message: Задача по теме 'Архитектура распределенных высоконагруженных систем' принята в обработку
        '400':
          description: Ошибка валидации входных данных
        '500':
          description: Внутренняя ошибка сервиса

  /api/v1/health:
    get:
      summary: Проверка статуса сервиса и подключения к Ollama
      description: Служебный эндпоинт мониторинга доступности локального инференса.
      operationId: healthCheck
      responses:
        '200':
          description: Статус агентного сервиса и локальной нейросети
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: Agent Layer (Variant 6)
                  status:
                    type: string
                    example: ok
                  ollama_status:
                    type: string
                    example: connected
                  model:
                    type: string
                    example: phi3
                  segment_size_bytes:
                    type: integer
                    example: 512

components:
  schemas:
    AppMessage:
      type: object
      required:
        - sender
        - timestamp
        - document_topic
      properties:
        sender:
          type: string
          description: Имя пользователя, отправившего запрос
          example: Ivan_Student
        timestamp:
          type: integer
          format: int64
          description: Временная метка запроса (сквозной ID транзакции)
          example: 1715600000
        document_topic:
          type: string
          description: Тема документа для генерации структуры (специфика Варианта 6)
          example: Архитектура распределенных высоконагруженных систем

    OperationResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Задача генерации принята в обработку